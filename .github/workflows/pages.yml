name: Validate and deploy GitHub Pages
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "::warning::package-lock.json is absent; using npm install for this validation run."
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests (Vitest only)
        run: npm run test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium core E2E
        run: npm run test:e2e -- --project=desktop
      - name: Production build
        run: npm run build
        env: { VITE_BASE_PATH: "/${{ github.event.repository.name }}/" }
      - name: Stage validated build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          retention-days: 1
  pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-build
    permissions: { contents: read, pages: write }
    steps:
      - name: Download validated build output
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    needs: pages-artifact
    permissions: { pages: write, id-token: write }
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
